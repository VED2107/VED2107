<svg xmlns="http://www.w3.org/2000/svg" width="930" height="45" viewBox="0 0 930 45" role="img" aria-label="Making software feel as good as it works"><style>.a{font:600 18px Consolas,Menlo,monospace;fill:#A997FF} .b,.c{font:600 18px Consolas,Menlo,monospace;fill:#A997FF;opacity:0}@media (prefers-reduced-motion:no-preference){.a{animation:fade1 12s infinite}.b{animation:fade2 12s infinite}.c{animation:fade3 12s infinite}}@keyframes fade1{0%,30%,100%{opacity:1}34%,96%{opacity:0}}@keyframes fade2{0%,30%,65%,100%{opacity:0}34%,61%{opacity:1}}@keyframes fade3{0%,64%,100%{opacity:0}68%,96%{opacity:1}}</style><text class="a" x="465" y="28" text-anchor="middle">Making software feel as good as it works.</text><text class="b" x="465" y="28" text-anchor="middle">Systems thinking. Product instinct. Pixel obsession.</text><text class="c" x="465" y="28" text-anchor="middle">Less noise. More engineering.</text></svg>